<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bracketLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bracketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="4.5" />

  <!-- Developer Code Bracket: < / > -->
  <!-- Left Bracket < -->
  <path d="M46 44 L28 64 L46 84" stroke="url(#bracketLeft)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <path d="M72 40 L56 88" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M82 44 L100 64 L82 84" stroke="url(#bracketRight)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>